<div class="container-fluid">
    <div class="justify-content-center">
      <div class="container bg rounded-5 border">
      </div>
      <div class="py-2"></div>
      <div class="py-5 text-center rounded-5 container bg-body-tertiary border">
        <img class="d-block mx-auto mb-4 rounded-5" src="/assets/images/logo_stem__2.svg" alt="" width="82" height="67">
        <h1 class="display-5 fw-bold text-body-emphasis">Sometimes Stemfields Is More</h1>
        <div class="mx-auto">
          <p class="lead mb-4">Transform challanges into solutions. Dedicate to crafting efficient, scalable applications,
            that make a real difference. Let's build today.</p>
          <div class="d-grid gap-2 d-sm-flex justify-content-sm-center">
            <button type="button-starship" class="btn btn-danger rounded-4 btn-lg px-4.2 gap-3">
              <h1 class="display-5 fw-bold">
                <a (click)="toggleFollower($event)" class="toggle-link mb- text-muted">
                  {{ isFollowing ? 'deactivate' : 'launch' }}
                </a>
              </h1>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
  <img #followerImage [class.active]="isFollowing" class="follower-image" [src]="gifPath" alt="Following GIF">
